spring:
  datasource:
    url: jdbc:h2:mem:aihub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/h2-jsonb-domain.sql
        - classpath:db/api-keys-schema.sql
        - classpath:db/call-logs-schema.sql
        - classpath:db/mcp-prompt-schema.sql
        - classpath:db/memories-schema.sql
        - classpath:db/rag-schema.sql

gateway:
  rag:
    upload:
      max-size-bytes: 1048576
    chunk:
      max-chars: 120
      overlap-chars: 20
      persist-batch-size: 100
    embedding:
      # 测试不加载 ONNX/远端模型；确定性向量，维度与生产表结构一致
      model: deterministic-embedding
      max-inputs: 64
      models:
        deterministic-embedding:
          provider: deterministic
          model: deterministic-hash-v1
          dimension: 384
          max-input-tokens: 8192
          max-batch-size: 4
          input-per-million: 0
      provider: deterministic
      model-id: deterministic-hash-v1
      dimension: 384
      max-input-tokens: 8192
      batch-size: 4
      max-retries: 1
      retry-backoff-ms: 10
      threads: 1
    vector-store:
      type: memory
    search:
      default-top-k: 3
      max-top-k: 3
      default-min-score: 0.0
      candidate-multiplier: 4
      max-candidates: 20
      max-query-chars: 2000
      rerank-enabled: true
      rerank-lexical-weight: 0.3
      max-filter-doc-ids: 5
    answer:
      default-top-k: 3
      max-context-chars: 400
      allow-free-answer: true
      fallback-message: "未找到相关资料。"
      empty-answer-message: "模型未返回有效答案。"
