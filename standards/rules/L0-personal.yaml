version: 1
layer: L0
name: 个人底线
rules:
  - id: rule-l0-secret-001
    title: 密钥与敏感凭据不入库、不进代码、不进日志
    statement: >-
      所有 API Key、数据库密码、令牌等敏感凭据只能通过环境变量或本地未提交配置文件注入；
      禁止硬编码、禁止提交到 Git、禁止打印到日志或异常信息。
    level: must
    category: security
    scope: [java, spring, python]
    source:
      doc: 金融科技开发技术规范.pdf
      section: 技术红线
      page: null
    rationale: 凭据泄露会导致生产事故与合规风险；日志与仓库是常见泄露渠道。
    examples:
      good: |
        api-key: ${DEEPSEEK_API_KEY:}
      bad: |
        api-key: sk-1234567890
    enforcement:
      type: manual
      tool: review
      config: null
    applicability:
      project7: true
      data-submission: true
    priority: P0

  - id: rule-l0-exception-001
    title: 禁止静默吞异常
    statement: >-
      捕获异常后必须处理或转换抛出；禁止空 catch、禁止仅 printStackTrace、
      禁止捕获后不记录也不上抛。
    level: must
    category: exception
    scope: [java, spring]
    source:
      doc: 金融科技开发技术规范.pdf
      section: 技术红线
      page: null
    rationale: 静默吞异常会隐藏故障，导致问题在生产环境放大。
    examples:
      good: |
        catch (IOException e) {
            log.error("read config failed", e);
            throw new GatewayException("CONFIG_READ_FAILED", e);
        }
      bad: |
        catch (IOException e) {
        }
    enforcement:
      type: auto
      tool: checkstyle
      config: config/checkstyle.xml
    applicability:
      project7: true
      data-submission: true
    priority: P0

  - id: rule-l0-commit-001
    title: 提交信息规范与作者纪律
    statement: >-
      提交信息使用 feat/fix/refactor/docs/test/chore: 简述；禁止包含模型署名；
      代码作者统一为 qtua。
    level: must
    category: process
    scope: [java, spring]
    source:
      doc: 编码环境规约.md
      section: 六、代码提交与作者纪律
      page: null
    rationale: 统一提交语义便于追溯；作者纪律保证代码归属清晰。
    examples:
      good: |
        feat: implement chat completions gateway
      bad: |
        update code (Co-Authored-By: Claude)
    enforcement:
      type: manual
      tool: review
      config: null
    applicability:
      project7: true
      data-submission: true
    priority: P1

  - id: rule-l0-test-001
    title: 新增或修改 service 方法必须有单测
    statement: >-
      新增或修改 service 层方法时，必须同步新增单测，覆盖成功场景与关键异常场景
      （参数校验、重复校验、状态校验等）。
    level: must
    category: testing
    scope: [java, spring]
    source:
      doc: data-submission-standards.md
      section: "16. Service 方法单测"
      page: null
    rationale: 单测是最低成本的行为回归保障，也是 AI 生成代码的必要验收手段。
    examples:
      good: |
        @Test
        void saves_successfully() { assertNotNull(service.save(req)); }
      bad: |
        只写实现，不写任何测试。
    enforcement:
      type: auto
      tool: jacoco
      config: pom.xml
    applicability:
      project7: true
      data-submission: true
    priority: P1

  - id: rule-l0-log-001
    title: 日志不得打印敏感信息
    statement: >-
      禁止在日志中打印 API Key、密码、完整令牌、身份证号、银行卡号等敏感字段；
      必要时脱敏（如只保留后四位）。
    level: must
    category: logging
    scope: [java, spring]
    source:
      doc: 金融科技开发技术规范.pdf
      section: 安全规范
      page: null
    rationale: 日志通常被集中采集，敏感信息进入日志等于扩大泄露面。
    examples:
      good: |
        log.info("key authenticated, keyId={}", keyId);
      bad: |
        log.info("key={}", apiKey);
    enforcement:
      type: manual
      tool: review
      config: null
    applicability:
      project7: true
      data-submission: true
    priority: P0

  - id: rule-l0-config-001
    title: 配置外部化，禁止硬编码环境地址
    statement: >-
      环境地址、端口、超时、模型名等可变参数必须外部化到配置文件或环境变量；
      禁止在代码中硬编码。
    level: must
    category: config
    scope: [java, spring]
    source:
      doc: 编码环境规约.md
      section: 一、任务目标确认
      page: null
    rationale: 硬编码导致环境迁移困难，且容易把测试配置带入生产。
    examples:
      good: |
        @ConfigurationProperties(prefix = "gateway")
      bad: |
        String url = "https://api.deepseek.com/chat/completions";
    enforcement:
      type: manual
      tool: review
      config: null
    applicability:
      project7: true
      data-submission: true
    priority: P1

  - id: rule-l0-sql-001
    title: 禁止拼接 SQL，必须参数化
    statement: >-
      所有 SQL 必须使用参数化绑定（#{} / ? / JPA 参数），禁止字符串拼接用户输入。
    level: must
    category: sql
    scope: [java, sql]
    source:
      doc: 金融科技开发技术规范.pdf
      section: 安全规范
      page: null
    rationale: 拼接 SQL 会导致 SQL 注入，是最常见的安全漏洞之一。
    examples:
      good: |
        SELECT * FROM api_keys WHERE key_hash = #{keyHash}
      bad: |
        "SELECT * FROM api_keys WHERE key_hash = '" + keyHash + "'"
    enforcement:
      type: manual
      tool: review
      config: null
    applicability:
      project7: true
      data-submission: true
    priority: P0

  - id: rule-l0-collection-001
    title: 禁止返回 null 集合或数组
    statement: >-
      方法返回集合或数组时，无数据必须返回空集合/空数组，禁止返回 null。
    level: must
    category: null-safety
    scope: [java]
    source:
      doc: Java开发手册_2022_黄山版.pdf
      section: 集合处理
      page: null
    rationale: 调用方通常直接遍历返回值，返回 null 会导致 NPE。
    examples:
      good: |
        return Collections.emptyList();
      bad: |
        return null;
    enforcement:
      type: manual
      tool: review
      config: null
    applicability:
      project7: true
      data-submission: true
    priority: P1

  - id: rule-l0-gate-001
    title: 提交前必须通过硬门禁
    statement: >-
      每次提交前必须运行 mvn -Pquality verify（或项目等价命令），
      门禁失败不得提交。
    level: must
    category: process
    scope: [java, spring]
    source:
      doc: 编码环境规约.md
      section: 二、静态验证规则
      page: null
    rationale: 门禁是规范落地的最后一道自动防线。
    examples:
      good: |
        mvn -Pquality verify && git commit
      bad: |
        跳过门禁直接提交。
    enforcement:
      type: manual
      tool: review
      config: null
    applicability:
      project7: true
      data-submission: true
    priority: P1

  - id: rule-l0-scope-001
    title: 不提交本地配置、密钥与临时文件
    statement: >-
      .gitignore 必须覆盖 application-local.yml、.env、日志、target/、
      IDE 本地设置等；提交前检查 git status。
    level: must
    category: process
    scope: [java, spring]
    source:
      doc: 编码环境规约.md
      section: 六、代码提交与作者纪律
      page: null
    rationale: 本地文件通常包含环境差异或敏感信息，提交后会污染仓库。
    examples:
      good: |
        git status --short
      bad: |
        git add .
    enforcement:
      type: manual
      tool: review
      config: null
    applicability:
      project7: true
      data-submission: true
    priority: P1
