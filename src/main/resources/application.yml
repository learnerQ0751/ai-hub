spring:
  application:
    name: ai-hub
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s

server:
  port: 18080

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{request_id:-}] %logger{36} - %msg%n"

gateway:
  master-key: ${GATEWAY_MASTER_KEY:}
  model-list: {}
