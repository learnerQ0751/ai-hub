# ai-hub 本地依赖：Redis（共享状态/限流/预算/锁）+ PostgreSQL（Key/日志/预算）
services:
  redis:
    image: redis:7.4-alpine
    container_name: ai-hub-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    container_name: ai-hub-postgres
    environment:
      POSTGRES_DB: aihub
      POSTGRES_USER: aihub
      POSTGRES_PASSWORD: aihub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  redis-data:
  postgres-data:
