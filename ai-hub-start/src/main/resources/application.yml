spring:
  application:
    name: ai-hub
  servlet:
    multipart:
      # 与 gateway.rag.upload.max-size-bytes 匹配；调整上传上限时两处一起改。
      max-file-size: ${RAG_MAX_FILE_SIZE:10MB}
      max-request-size: ${RAG_MAX_REQUEST_SIZE:12MB}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aihub}
    username: ${DB_USER:aihub}
    password: ${DB_PASSWORD:aihub}
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

mybatis:
  mapper-locations: classpath*:com/qtua/aihub/dal/mapper/*.xml

server:
  port: 18080

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{request_id:-}] %logger{36} - %msg%n"

gateway:
  master-key: ${GATEWAY_MASTER_KEY:}
  model-list: {}
  pricing:
    models: {}
  rate-limit:
    enabled: true
    fail-open: true
    window-seconds: 60
    default-max-tokens: 1024
  memory:
    # 默认项目隔离；开启后仅用户级记忆（session_id 为空）可跨项目召回
    cross-project-sharing-enabled: false
    max-ttl-seconds: 7776000
    max-content-length: 10000
    max-metadata-length: 8192
    default-recall-limit: 20
    max-recall-limit: 100
  rag:
    upload:
      # 单文件上限；同时调整 spring.servlet.multipart 上限
      max-size-bytes: 10485760
    chunk:
      max-chars: 800
      overlap-chars: 100
      persist-batch-size: 200
    dedup:
      # false：重复 hash 返回已有文档；true：删除旧文档后重新接入
      override: false
    list:
      default-limit: 100
      max-limit: 500
    embedding:
      # langchain4j-local（默认）或 deterministic（测试/离线）
      provider: langchain4j-local
      model-id: all-minilm-l6-v2
      dimension: 384
      batch-size: 32
      max-retries: 2
      retry-backoff-ms: 200
      threads: 2
    vector-store:
      # pgvector（默认）或 memory（测试/无 PG）
      type: pgvector
