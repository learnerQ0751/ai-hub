# 数据面/控制面共享配置（REQ-5.1）。
# 端口、应用名、Flyway 归属由各启动模块的 application.yml 覆盖。
spring:
  servlet:
    multipart:
      # multipart 硬上限取各类型最大限制（pdf 50MB）+ 边距；业务限制在 gateway.rag.upload.type-limits。
      max-file-size: ${RAG_MAX_FILE_SIZE:50MB}
      max-request-size: ${RAG_MAX_REQUEST_SIZE:52MB}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aihub}
    username: ${DB_USER:aihub}
    password: ${DB_PASSWORD:aihub}
  sql:
    init:
      mode: never

mybatis:
  mapper-locations: classpath*:com/qtua/aihub/dal/mapper/*.xml

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{request_id:-}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

gateway:
  master-key: ${GATEWAY_MASTER_KEY:}
  # 上游凭证加密密钥（AES-256-GCM）；生产必须配置，缺失时退化为弱编码并告警
  secret-key: ${GATEWAY_SECRET_KEY:}
  trace:
    # 采样率 0~1；生产可降到 0.1，默认全量
    sample-rate: ${GATEWAY_TRACE_SAMPLE_RATE:1.0}
  audit:
    # 审计保留天数（本期只声明策略，自动清理需合规流程）
    retention-days: ${GATEWAY_AUDIT_RETENTION_DAYS:365}
  model-list: {}
  pricing:
    models: {}
  rate-limit:
    enabled: true
    fail-open: true
    window-seconds: 60
    default-max-tokens: 1024
  memory:
    # 默认项目隔离；开启后仅用户级记忆（session_id 为空）可跨项目召回
    cross-project-sharing-enabled: false
    max-ttl-seconds: 7776000
    max-content-length: 10000
    max-metadata-length: 8192
    default-recall-limit: 20
    max-recall-limit: 100
  rag:
    upload:
      # 默认单文件上限（未命中类型）；类型上限见 type-limits，multipart 为硬上限
      max-size-bytes: 10485760
      type-limits:
        pdf: 52428800
        txt: 20971520
        md: 20971520
        docx: 31457280
        # pptx 限制到 40MB，保持 multipart 50MB 硬上限不变
        pptx: 41943040
        xlsx: 31457280
        html: 10485760
        htm: 10485760
    parse:
      # 解析输出字符上限；超限按 limit-policy 处理
      max-chars: 5000000
      max-rows-per-sheet: 50000
      max-cells-per-sheet: 500000
      max-sheets: 200
      max-columns: 256
      max-table-rows: 10000
      max-table-cells: 100000
      max-slides: 2000
      max-shapes-per-slide: 5000
      # 解压炸弹防护：条目数 / 单条目 / 解压总大小
      max-zip-entries: 10000
      max-zip-entry-bytes: 67108864
      max-zip-total-bytes: 268435456
      include-headers-footers: true
      include-notes: false
      # fail（默认，超限报错）或 truncate（截断并追加标记）
      limit-policy: fail
    chunk:
      # 0 = 按 embedding 模型 max-input-tokens×0.8 自动推导（v3 下为 800 字）
      max-chars: 0
      overlap-chars: 100
      persist-batch-size: 200
      # 超出模型安全窗口：warn（默认）或 fail（启动失败）
      overflow-policy: warn
    index:
      # 索引游标分页大小；0 = 与 embedding.batch-size 对齐
      page-size: 0
    dedup:
      # false：重复 hash 返回已有文档；true：删除旧文档后重新接入
      override: false
    list:
      default-limit: 100
      max-limit: 500
    embedding:
      # RAG 使用的模型别名（对应 models 中的键）
      model: text-embedding-v3
      # 单次 /v1/embeddings 最大输入条数
      max-inputs: 2048
      models:
        text-embedding-v3:
          provider: dashscope
          model: text-embedding-v3
          dimension: 1024
          max-input-tokens: 8192
          # 阿里官方限制：单次最多 10 条
          max-batch-size: 10
          # 每 1M tokens 输入单价（按供应商实际价格调整）
          input-per-million: 0.5
          api-base: https://dashscope.aliyuncs.com/compatible-mode/v1
          api-key: ${DASHSCOPE_API_KEY:}
          api-key-env: DASHSCOPE_API_KEY
          timeout-ms: 30000
          max-retries: 2
          retry-backoff-ms: 200
      # 旧单模型字段（models 为空时生效；保留用于测试/离线）
      provider: langchain4j-local
      model-id: all-minilm-l6-v2
      dimension: 384
      batch-size: 10
      max-retries: 2
      retry-backoff-ms: 200
      threads: 2
    vector-store:
      # pgvector（默认）或 memory（测试/无 PG）
      type: pgvector
    search:
      default-top-k: 5
      max-top-k: 50
      default-min-score: 0.0
      # 候选放大：candidate = top_k × multiplier，受 max-candidates 约束
      candidate-multiplier: 4
      max-candidates: 200
      max-query-chars: 2000
      # 服务端重排总开关；请求只能关闭，不能越权打开
      rerank-enabled: true
      rerank-lexical-weight: 0.3
      max-filter-doc-ids: 100
      # REQ-5.3 混合检索：向量 + 字面 RRF 融合；关闭时回到三期行为
      hybrid-enabled: true
      rrf-k: 60
      rrf-vector-weight: 1.0
      rrf-keyword-weight: 1.0
      # 字面召回最多使用的查询词项数（中文 bigram/英文词）
      keyword-max-terms: 16
    answer:
      default-top-k: 4
      # 放入 prompt 的资料部分最大字符数
      max-context-chars: 6000
      # REQ-5.4 邻接扩展：命中切片前后各取 n 条上下文；0 关闭
      neighbor-window: 1
      # 无召回时默认不调模型；开启后仍需请求显式 allow_free_answer=true
      allow-free-answer: false
      fallback-message: "未在知识库中检索到相关资料，无法回答该问题。"
      empty-answer-message: "模型未返回有效答案，请补充资料后重试。"
